<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 10; ry: 10; }
      .optics { fill: #eef2ff; stroke: #3730a3; stroke-width: 2; rx: 10; ry: 10; }
      .sensor { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 10; ry: 10; }
      .digit { fill: #ecfdf5; stroke: #065f46; stroke-width: 2; rx: 10; ry: 10; }
      .label { font-family: Arial, sans-serif; font-size: 18px; fill: #111827; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #374151; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#111827" />
    </marker>
  </defs>

  <rect x="30" y="90" width="190" height="110" class="box" />
  <text x="50" y="128" class="label">Particle state</text>
  <text x="50" y="152" class="small">x, y, z, size</text>
  <text x="50" y="172" class="small">source intensity</text>

  <rect x="250" y="90" width="210" height="110" class="optics" />
  <text x="270" y="128" class="label">Laser weighting</text>
  <text x="270" y="152" class="small">I(z) from width,</text>
  <text x="270" y="172" class="small">shape_factor</text>

  <rect x="490" y="90" width="220" height="110" class="optics" />
  <text x="510" y="128" class="label">Optical projection</text>
  <text x="510" y="152" class="small">Gaussian particle image</text>
  <text x="510" y="172" class="small">+ fill factors + defocus</text>

  <rect x="740" y="90" width="220" height="110" class="sensor" />
  <text x="760" y="128" class="label">Sensor noise model</text>
  <text x="760" y="152" class="small">qe, shot noise,</text>
  <text x="760" y="172" class="small">baseline + dark noise</text>

  <rect x="990" y="90" width="180" height="110" class="digit" />
  <text x="1010" y="128" class="label">Digitization</text>
  <text x="1010" y="152" class="small">sensitivity</text>
  <text x="1010" y="172" class="small">bit depth, saturation</text>

  <path d="M220 145 L250 145" class="arrow" />
  <path d="M460 145 L490 145" class="arrow" />
  <path d="M710 145 L740 145" class="arrow" />
  <path d="M960 145 L990 145" class="arrow" />

  <text x="500" y="250" class="small">Output: synthetic PIV image (ADU counts) + particle status flags</text>
</svg>
